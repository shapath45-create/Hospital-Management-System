<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prescribe Medicine</title>

    <link rel="stylesheet" href="common.css">
</head>

<body>

    <header style="text-align: center;">
        <h2>Prescribe Medicine</h2>
    </header>

    <div style="text-align: center;">

        <form method="POST">

            <div>
                <label for="patient_id">Patient ID:</label>
                <br>
                <input type="text" id="patient_id"
                       name="patient_id" required>
            </div>

            <br>

            <div>
                <label for="medicine">Medicine:</label>
                <br>
                <input type="text" id="medicine"
                       name="medicine" required>
            </div>

            <br>

            <div>
                <label for="diagnosis">Diagnosis:</label>
                <br>
<textarea id="diagnosis" name="diagnosis"
  rows="4" required></textarea>
 </div>

  <br>

<button type="submit">Submit Prescription</button>

 </form>

<br>

 <button type="button"
 onclick="window.location.href='dash.html'">
Back to Dashboard
 </button>

    </div>

</body>

</html>
