<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard</title>

    <link rel="stylesheet" href="common.css">
</head>

<body>

    <header class="doctor-header" style="text-align: center;">

        <div class="doctor-info">
            <h1>Asif Khandaker</h1>
            <p>MBBS, FCPS | Medicine Department</p>
            <span>Doctor Portal</span>
        </div>

        <button type="button" class="logout-btn"
            onclick="window.location.href='login (1).html'">
            Logout
        </button>

    </header>

    <form class="dashboard-content" style="text-align: center;">

        <h2>Doctor Dashboard</h2>

        <p class="welcome-text">
            Welcome, Doctor!
            Manage your patients and medical activities.
        </p>

        <div class="dashboard-buttons" style="text-align: center;">

            <button type="button"
                onclick="window.location.href='app.html'">
                Check Appointments
            </button>

            <button type="button"
                onclick="window.location.href='prescribe.html'">
                Prescribe Medicine
            </button>

            <button type="button"
                onclick="window.location.href='history.html'">
                Check Treatment History
            </button>

            <button type="button"
                onclick="window.location.href='intake.html'">
                Intake & Vitals
            </button>

            <button type="button"
                onclick="window.location.href='lab.html'">
                Lab & Test Review
            </button>

        </div>

    </form>

</body>

</html>
