<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>

    <header class="main-header">
        <h1>Add Doctor</h1>
    </header>

    <div class="doctor-container">
        <form action="admin.html" method="get">
            <table class="form-table">
                <tr>
                    <td><label for="docName">Name:</label></td>
                    <td>
                        <input type="text" id="docName" name="docName" placeholder="Enter doctor's name" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="docId">ID:</label></td>
                    <td>
                        <input type="text" id="docId" name="docId" placeholder="Enter doctor's ID" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="department">Department:</label></td>
                    <td>
                        <select id="department" name="department" required>
                            <option value="" disabled selected>Select Department</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="General Medicine">General Medicine</option>
                            <option value="Surgery">Surgery</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="phone">Phone:</label></td>
                    <td>
                        <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td class="btn-group">
                        <input type="submit" class="submit-btn" value="Save">
                        <input type="reset" class="reset-btn" value="Reset">
                    </td>
                </tr>
            </table>
        </form>

        <a href="admin.html" class="back-btn" aria-label="Back to Admin Panel" title="Back to Admin Panel">
    Back
</a>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Hazratt Muhammad (sa.) International Hospital.</p>
        <p>All rights reserved</p>
    </footer>

</body>
</html>
