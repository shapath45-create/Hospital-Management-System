<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Department</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>

    <header class="main-header">
        <h1>Add Department</h1>
    </header>

    <div class="doctor-container">
        <form action="admin.html" method="get">
            <table class="form-table">
                <tr>
                    <td><label for="deptName">Department Name:</label></td>
                    <td>
                        <input type="text" id="deptName" name="deptName" placeholder="Enter department name" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="deptCode">Department Code:</label></td>
                    <td>
                        <input type="text" id="deptCode" name="deptCode" placeholder="Enter department code (e.g., DEPT-01)" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="deptHead">Head of Department:</label></td>
                    <td>
                        <input type="text" id="deptHead" name="deptHead" placeholder="Enter head of department name" required>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td class="btn-group">
                        <input type="submit" class="submit-btn" value="Save">
                        <input type="reset" class="reset-btn" value="Reset">
                    </td>
                </tr>
            </table>
        </form>

        <a href="admin.html" class="back-btn" aria-label="Back to Admin Panel" title="Back to Admin Panel">
            Back
        </a>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Hazratt Muhammad (sa.) International Hospital.</p>
        <p>All rights reserved</p>
    </footer>

</body>
</html>
