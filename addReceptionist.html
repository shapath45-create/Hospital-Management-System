<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Receptionist</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>

    <header class="main-header">
        <h1>Add Receptionist</h1>
    </header>

    <div class="doctor-container">
        <form action="admin.html" method="get" onsubmit="return validateReceptionistForm()">
            <table class="form-table">
                <tr>
                    <td><label for="recName">Name:</label></td>
                    <td>
                        <input type="text" id="recName" name="recName" placeholder="Enter receptionist's name" required>
                        <span id="recNameError" class="error-text"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="recId">ID:</label></td>
                    <td>
                        <input type="text" id="recId" name="recId" placeholder="Enter receptionist's ID" required>
                        <span id="recIdError" class="error-text"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="phone">Phone:</label></td>
                    <td>
                        <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
                        <span id="recPhoneError" class="error-text"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="shift">Shift:</label></td>
                    <td>
                        <select id="shift" name="shift" required>
                            <option value="" disabled selected>Select Shift</option>
                            <option value="Morning">Morning (8:00 AM - 4:00 PM)</option>
                            <option value="Evening">Evening (4:00 PM - 12:00 AM)</option>
                            <option value="Night">Night (12:00 AM - 8:00 AM)</option>
                        </select>
                        <span id="recShiftError" class="error-text"></span>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td class="btn-group">
                        <input type="submit" class="submit-btn" value="Save">
                        <input type="reset" class="reset-btn" value="Reset" onclick="resetReceptionistFormDOM()">
                    </td>
                </tr>
            </table>
        </form>

        <a href="admin.html" class="back-btn" aria-label="Back to Admin Panel" title="Back to Admin Panel">
            Back
        </a>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Hazratt Muhammad (sa.) International Hospital.</p>
        <p>All rights reserved</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
